function probColor(p) {
  const stops = [
    [0.0, [214,40,40]],
    [0.25,[232,93,4]],
    [0.5, [249,199,79]],
    [0.75,[128,185,24]],
    [1.0, [42,157,143]]
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    if (p <= stops[i+1][0]) {
      const t = (p - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      const r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      const g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      const b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return `rgb(${r},${g},${b})`;
    }
  }
  return `rgb(42,157,143)`;
}

function buildHemicycleCoords(n, nRows=9) {
  const angleSpread = Math.PI * 0.82;
  const rInner = 350, rOuter = 780;
  const radii = [];
  for (let i = 0; i < nRows; i++) radii.push(rInner + (rOuter - rInner) * i / (nRows - 1));

  const arcLens = radii.map(r => r * angleSpread);
  const totalArc = arcLens.reduce((a,b) => a+b, 0);
  let seatsPerRow = arcLens.map(a => Math.round(a / totalArc * n));
  let diff = n - seatsPerRow.reduce((a,b) => a+b, 0);
  for (let i = 0; Math.abs(diff) > 0; i++) {
    const idx = diff > 0 ? (nRows - 1 - (i % nRows)) : (i % nRows);
    seatsPerRow[idx] += diff > 0 ? 1 : -1;
    diff += diff > 0 ? -1 : 1;
  }

  const coords = [];
  for (let row = 0; row < nRows; row++) {
    const r = radii[row];
    const nS = seatsPerRow[row];
    const startA = (Math.PI - angleSpread) / 2;
    const endA = Math.PI - startA;
    for (let j = 0; j < nS; j++) {
      const a = nS > 1 ? startA + (endA - startA) * j / (nS - 1) : Math.PI / 2;
      coords.push({ x: r * Math.cos(a), y: -r * Math.sin(a), row });
    }
  }
  return coords;
}

function render(idx) {
  const b = DATA.besluiten[idx];
  const seats = b.seats;
  const svg = document.getElementById('hemicycle');
  svg.innerHTML = '';

  // Sort seats by party order
  const partyRank = {};
  PARTY_ORDER.forEach((p, i) => partyRank[p] = i);
  seats.sort((a, b) => (partyRank[a.party] ?? 99) - (partyRank[b.party] ?? 99) || a.name.localeCompare(b.name));

  const coords = buildHemicycleCoords(seats.length);

  // Party sections — arc sectors behind each party bloc
  const rInner = 350, rOuter = 780;
  const sections = [];
  let i = 0;
  while (i < seats.length) {
    const party = seats[i].party;
    const start = i;
    while (i < seats.length && seats[i].party === party) i++;
    sections.push({ party, start, end: i, indices: [...Array(i - start)].map((_, k) => start + k) });
  }
  sections.forEach(sec => {
    const pts = sec.indices.map(j => coords[j]);
    const angles = pts.map(p => Math.atan2(-p.y, p.x));
    let aMin = Math.min(...angles) - 0.03, aMax = Math.max(...angles) + 0.03;
    const x1 = rOuter * Math.cos(aMin), y1 = -rOuter * Math.sin(aMin);
    const x2 = rOuter * Math.cos(aMax), y2 = -rOuter * Math.sin(aMax);
    const x3 = rInner * Math.cos(aMax), y3 = -rInner * Math.sin(aMax);
    const x4 = rInner * Math.cos(aMin), y4 = -rInner * Math.sin(aMin);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M 0,0 L ${x1},${y1} A ${rOuter} ${rOuter} 0 0 1 ${x2},${y2} L ${x3},${y3} A ${rInner} ${rInner} 0 0 0 ${x4},${y4} Z`);
    const col = PARTY_COLORS[sec.party] || '#444';
    path.setAttribute('fill', col);
    path.setAttribute('opacity', '0.12');
    path.setAttribute('stroke', col);
    path.setAttribute('stroke-width', '1');
    path.setAttribute('stroke-opacity', '0.35');
    svg.appendChild(path);
  });

  // Stats
  const nDirect = seats.filter(s => s.source === 'model').length;
  const nParty = seats.filter(s => s.source === 'party_avg').length;
  const nHist = seats.filter(s => s.source === 'historical' || s.source === 'default').length;
  const predVoor = seats.filter(s => s.prob > 0.5).length;
  const predTegen = seats.filter(s => s.prob <= 0.5).length;
  const correct = seats.filter(s => (s.prob > 0.5 && s.vote === 'Voor') || (s.prob <= 0.5 && s.vote === 'Tegen')).length;

  document.getElementById('stats-bar').innerHTML = `
    <span class="stat">Predicted: <b>${predVoor} Voor</b> / <b>${predTegen} Tegen</b></span>
    <span class="stat">Actual: <b>${b.n_voor} Voor</b> / <b>${b.n_tegen} Tegen</b></span>
    <span class="stat">Accuracy: <b>${b.accuracy}%</b> (${correct}/${seats.length})</span>
    <span class="stat">Sources: <b>${nDirect}</b> direct, <b>${nParty}</b> party, <b>${nHist}</b> hist</span>
    <span class="stat">${b.besluit}</span>
  `;

  // Podium — centered at origin, seats arc above (negative y)
  const podium = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  podium.setAttribute('x', -120); podium.setAttribute('y', -60);
  podium.setAttribute('width', 240); podium.setAttribute('height', 60);
  podium.setAttribute('rx', 12);
  podium.setAttribute('fill', '#12122a'); podium.setAttribute('stroke', '#ffffff15');
  svg.appendChild(podium);
  const vText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  vText.setAttribute('x', 0); vText.setAttribute('y', -24);
  vText.setAttribute('text-anchor', 'middle'); vText.setAttribute('fill', '#ffffff40');
  vText.setAttribute('font-size', '13'); vText.setAttribute('font-weight', '600');
  vText.textContent = 'VOORZITTER';
  svg.appendChild(vText);

  // Party labels
  const partyGroups = {};
  seats.forEach((s, i) => {
    if (!partyGroups[s.party]) partyGroups[s.party] = { xs: [], ys: [], probs: [] };
    partyGroups[s.party].xs.push(coords[i].x);
    partyGroups[s.party].ys.push(coords[i].y);
    partyGroups[s.party].probs.push(s.prob);
  });
  for (const [party, g] of Object.entries(partyGroups)) {
    if (g.xs.length < 2) continue;
    const xMean = g.xs.reduce((a,b) => a+b, 0) / g.xs.length;
    const yMax = Math.max(...g.ys) + 28;
    const avgProb = g.probs.reduce((a,b) => a+b, 0) / g.probs.length;
    const label = PARTY_SHORT[party] || party;

    const t1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t1.setAttribute('x', xMean); t1.setAttribute('y', yMax);
    t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('fill', '#ffffffb0');
    t1.setAttribute('font-size', '11'); t1.setAttribute('font-weight', '700');
    t1.textContent = label;
    svg.appendChild(t1);

    const t2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t2.setAttribute('x', xMean); t2.setAttribute('y', yMax + 16);
    t2.setAttribute('text-anchor', 'middle');
    t2.setAttribute('fill', probColor(avgProb));
    t2.setAttribute('font-size', '10'); t2.setAttribute('font-weight', '600');
    t2.textContent = `${(avgProb * 100).toFixed(0)}% V`;
    svg.appendChild(t2);
  }

  // Draw seats
  const tooltip = document.getElementById('tooltip');
  seats.forEach((s, i) => {
    const c = coords[i];
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.cursor = 'pointer';

    let r, strokeW, strokeColor, opacity;
    if (s.source === 'model') {
      r = 18; strokeW = 2.5; strokeColor = '#ffffffdd'; opacity = 1.0;
    } else if (s.source === 'party_avg') {
      r = 14; strokeW = 1.2; strokeColor = '#ffffff60'; opacity = 0.85;
    } else {
      r = 11; strokeW = 0.7; strokeColor = '#ffffff25'; opacity = 0.5;
    }

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', c.x); circle.setAttribute('cy', c.y);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', probColor(s.prob));
    circle.setAttribute('stroke', strokeColor);
    circle.setAttribute('stroke-width', strokeW);
    circle.setAttribute('opacity', opacity);
    g.appendChild(circle);

    // Actual vote triangle for direct predictions
    if (s.source === 'model') {
      const tri = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const ty = c.y + r + 8;
      if (s.vote === 'Voor') {
        tri.setAttribute('points', `${c.x},${ty - 7} ${c.x - 5},${ty + 3} ${c.x + 5},${ty + 3}`);
        tri.setAttribute('fill', '#2a9d8f');
      } else {
        tri.setAttribute('points', `${c.x},${ty + 3} ${c.x - 5},${ty - 7} ${c.x + 5},${ty - 7}`);
        tri.setAttribute('fill', '#e63946');
      }
      tri.setAttribute('opacity', '0.9');
      g.appendChild(tri);
    }

    // Hover
    g.addEventListener('mouseenter', (e) => {
      circle.setAttribute('r', r + 4);
      circle.setAttribute('stroke', '#fff');
      circle.setAttribute('stroke-width', 3);
      circle.setAttribute('opacity', 1);

      tooltip.style.display = 'block';
      tooltip.querySelector('.tt-name').textContent = s.name;
      tooltip.querySelector('.tt-party').textContent = s.party;
      const predLabel = s.prob > 0.5 ? 'Voor' : 'Tegen';
      const predEl = document.getElementById('tt-pred');
      predEl.textContent = predLabel;
      predEl.className = 'tt-val ' + predLabel.toLowerCase();
      document.getElementById('tt-prob').textContent = `${(s.prob * 100).toFixed(1)}% Voor`;
      const actEl = document.getElementById('tt-actual');
      actEl.textContent = s.vote;
      actEl.className = 'tt-val ' + (s.vote === 'Voor' ? 'voor' : 'tegen');
      const sourceLabels = {model: 'Direct model prediction (speaker)', party_avg: 'Party-average from speakers', historical: 'Historical party bias', default: 'Default (no data)'};
      document.getElementById('tt-source').textContent = sourceLabels[s.source] || s.source;
    });
    g.addEventListener('mousemove', (e) => {
      const ttW = tooltip.offsetWidth;
      const ttH = tooltip.offsetHeight;
      let left = e.clientX + 15;
      let top = e.clientY - 10;
      if (left + ttW > window.innerWidth - 10) left = e.clientX - ttW - 15;
      if (top + ttH > window.innerHeight - 10) top = e.clientY - ttH - 10;
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    });
    g.addEventListener('mouseleave', () => {
      circle.setAttribute('r', r);
      circle.setAttribute('stroke', strokeColor);
      circle.setAttribute('stroke-width', strokeW);
      circle.setAttribute('opacity', opacity);
      tooltip.style.display = 'none';
    });

    svg.appendChild(g);
  });
}

// Draw colorbar
const cbCanvas = document.getElementById('colorbar');
const cbCtx = cbCanvas.getContext('2d');
for (let x = 0; x < 200; x++) {
  cbCtx.fillStyle = probColor(x / 199);
  cbCtx.fillRect(x, 0, 1, 14);
}

loadData();
</script>
